name: Android build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch and prepare the 304-game Puzzle Suite
        run: |
          git clone --filter=blob:none https://github.com/sidhant947/Puzzle.git /tmp/gamebox-puzzle
          git -C /tmp/gamebox-puzzle fetch --depth 1 origin 3e70679e51509bd669660b5a4556942fba48321a
          git -C /tmp/gamebox-puzzle checkout 3e70679e51509bd669660b5a4556942fba48321a
          python3 scripts/prepare_puzzle_suite.py /tmp/gamebox-puzzle
          cd /tmp/gamebox-puzzle
          flutter pub get
          flutter build web --release --base-href /assets/puzzle/ --pwa-strategy=none
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/puzzle"
          cp -a build/web/. "$GITHUB_WORKSPACE/app/src/main/assets/puzzle/"
      - name: Fetch and prepare 190 additional offline HTML5 games
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/sausi-7/games.git /tmp/sausi-games
          git -C /tmp/sausi-games fetch --depth 1 origin c97ef8bec4a4ce3154b4345a79aeda3ea2a6a465
          git -C /tmp/sausi-games checkout c97ef8bec4a4ce3154b4345a79aeda3ea2a6a465 -- games LICENSE
          git clone --depth 1 https://github.com/mashukui/web-games.git /tmp/mashukui-web-games
          git -C /tmp/mashukui-web-games fetch --depth 1 origin 2770860c6e2b3ab8144a56462d8178fe7e3445c7
          git -C /tmp/mashukui-web-games checkout 2770860c6e2b3ab8144a56462d8178fe7e3445c7
          python3 scripts/prepare_browser_games.py /tmp/sausi-games /tmp/mashukui-web-games app/src/main/assets/mini
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GAME-BOX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
